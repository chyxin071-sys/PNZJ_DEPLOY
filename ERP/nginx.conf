server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 微信小程序业务域名校验文件
    location = /ljCjuUEYbP.txt {
        default_type text/plain;
        return 200 "0ab969a492437da11868eb8efc2bb05d";
    }

    # 匹配 /erp 及子路径
    location /erp {
        try_files $uri $uri/ /erp/index.html;
    }

    # 根路径自动跳转到 /erp/，并保留查询参数（如微信分享带来的参数）
    location = / {
        return 301 /erp/$is_args$args;
    }
}